services:

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - ./data:/home/node/.n8n
    restart: always
    depends_on:
      - scraper
      - postgres

  scraper:
    build:
      context: ../Practicas_Automatizacion/WebScraping
      dockerfile: Dockerfile
    container_name: webscraping
    restart: always
    expose:
      - "8000"

  postgres:
    image: postgres:16
    container_name: postgres_scraping
    restart: always
    environment:
      POSTGRES_DB: scraping
      POSTGRES_USER: scraping_user
      POSTGRES_PASSWORD: scraping_password
      TZ: America/Guayaquil
    volumes:
      - postgres_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase.db
    restart: always
    depends_on:
      - postgres

volumes:
  postgres_data:
  metabase_data:
